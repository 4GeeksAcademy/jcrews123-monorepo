[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brasaland-api"
version = "0.2.0"
description = "Brasaland Digital FastAPI service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "tinydb>=4.8",
    "python-jose[cryptography]>=3.3.0",
    "libpass[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = [
    "main",
    "seed",
    "database",
    "auth_database",
    "supplier_constants",
    "inventory_constants",
    "inventory_seed",
    "state",
    "serializers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["routers*", "schemas*", "core*", "services*", "db*", "models*"]
